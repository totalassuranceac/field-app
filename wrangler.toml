name = "total-assurance-fleet"
main = "worker/index.ts"
compatibility_date = "2025-02-24"
compatibility_flags = ["nodejs_compat"]
account_id = "f6da342467e60df683731c55dfc0e7b4"
workers_dev = true

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Always run the Worker so we can set no-cache on HTML (fixes stuck PWAs)
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "fleet_db"
database_id = "9126adda-009e-4aff-8f78-dddf54be8ffa"
preview_database_id = "9126adda-009e-4aff-8f78-dddf54be8ffa"

# After enabling R2 in the Cloudflare dashboard:
#   npx wrangler r2 bucket create fleet-receipts
# then uncomment:
# [[r2_buckets]]
# binding = "RECEIPTS"
# bucket_name = "fleet-receipts"
# preview_bucket_name = "fleet-receipts-preview"

[vars]
APP_NAME = "Field App"
WORKSPACE_DOMAIN = ""
GOOGLE_ALLOWED_EXTRA = ""

# Optional Atlas warranty drop-off webhook (secrets — do not put values here):
#   npx wrangler secret put ATLAS_WARRANTY_WEBHOOK_URL
#   npx wrangler secret put ATLAS_WARRANTY_WEBHOOK_AUTH
# Env keys: ATLAS_WARRANTY_WEBHOOK_URL, ATLAS_WARRANTY_WEBHOOK_AUTH (see worker/types.ts)

# 5:00am America/Chicago: truck restock lists only (10:00 UTC daylight, 11:00 UTC standard).
# The worker builds the list only when the Chicago hour is 5. Opening Restock still builds yesterday if this was missed.
# ~8am Central (13:00 UTC): shop bring-in + light ops nudges. Not the restock list.
# Evening (every 20 min 21:00–03:40 UTC ≈ 4pm–10:40pm CT): after-hours ST assignment SMS poll
# Clock watch: every 5 minutes, all day.
# No-clock-in texts stay weekdays 7:00 AM-6:00 PM Chicago.
# Left-on-job runs any hour so an overnight open job is caught.
# Flag default off: one settings read, then return. No shop bring-in and no assignment texts.
[triggers]
crons = ["0 10 * * *", "0 11 * * *", "0 13 * * *", "0,20,40 21-23 * * *", "0,20,40 0-3 * * *", "*/5 * * * *"]
